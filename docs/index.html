<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plantão TN II — estudo para a prova</title>
    <meta
      name="description"
      content="Estudo gamificado para a prova objetiva de Terapia Nutricional II. Conteúdo tirado só dos slides da disciplina."
    />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icone.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icone-180.png" />
    <meta name="apple-mobile-web-app-title" content="Plantão TN II" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-latin.woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Antes da primeira pintura, para não piscar o tema errado.
      try {
        var t = localStorage.getItem("tn2:tema");
        if (t) document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="pular-para" href="#conteudo">Pular para o conteúdo</a>

    <header class="cabecalho">
      <div class="cabecalho-int">
        <a class="marca" href="#/hoje">Plantão <span>TN&nbsp;II</span></a>
        <div class="cabecalho-dir">
          <a class="chip-nivel" href="#/painel" id="chip-nivel" title="Ver painel de progresso">
            <span class="anel" id="anel-nivel" data-nivel="1" style="--pct: 0"></span>
            <b id="chip-nome">Estagiária</b>
          </a>
          <button class="icone-btn" id="btn-tema" type="button" aria-label="Alternar tema claro e escuro">
            <svg class="i-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round" />
            </svg>
            <svg class="i-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <nav class="abas" aria-label="Seções">
      <a class="aba" href="#/hoje" data-rota="hoje">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2.5" />
          <path d="M8 3v4M16 3v4M3 10h18" stroke-linecap="round" />
        </svg>
        Hoje
      </a>
      <a class="aba" href="#/trilha" data-rota="trilha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="6.5" cy="6" r="2.6" />
          <circle cx="17.5" cy="18" r="2.6" />
          <path d="M9 6.6c5 .6 2 5 5 6 1.2.4 2.3.9 3 2.2" stroke-linecap="round" />
        </svg>
        Trilha
      </a>
      <a class="aba" href="#/flashcards" data-rota="flashcards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="3" y="6" width="14" height="13" rx="2.2" />
          <path d="M7 3h12a2 2 0 0 1 2 2v11" stroke-linecap="round" />
        </svg>
        Cards
        <span class="aba-pino vis-oculto" id="pino-cards" hidden></span>
      </a>
      <a class="aba" href="#/calculos" data-rota="calculos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="2.5" />
          <path d="M8 7h8M8 12h3M8 16h3M15 12v4M13 14h4" stroke-linecap="round" />
        </svg>
        Cálculos
      </a>
      <a class="aba" href="#/painel" data-rota="painel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round" />
        </svg>
        Painel
      </a>
    </nav>

    <main id="conteudo" tabindex="-1"></main>

    <div id="anuncio" class="vis-oculto" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
